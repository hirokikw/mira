global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend mira_front
    bind *:8080
    default_backend mira_apache

backend mira_apache
    balance roundrobin
    # Tomcat×2 構成では JSESSIONID 単位で httpd（＝Tomcat）を固定する（CSRF・セッション）
    cookie JSESSIONID prefix nocache
    option httpchk GET /login
    http-check expect status 200
    default-server inter 5s fall 3 rise 2
    server httpd1 httpd-1:80 check cookie s1
    server httpd2 httpd-2:80 check cookie s2
