spring.application.name=mira

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mira}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:mira}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mira}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.thymeleaf.cache=false