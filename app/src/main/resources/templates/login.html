<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ログイン | MIRA</title>
    <link rel="stylesheet" th:href="@{/css/mira.css}">
</head>
<body class="page-center">
<main class="card card-narrow">
    <h1 class="page-title">ログイン</h1>

    <p class="alert alert-error" th:if="${loginError}">ログインに失敗しました。ログイン ID とパスワードを確認してください。</p>
    <p class="alert alert-info" th:if="${logoutMessage}">ログアウトしました。</p>

    <form th:action="@{/login}" method="post" class="form">
        <div class="field">
            <label for="loginId">ログイン ID</label>
            <input id="loginId" name="loginId" type="text" maxlength="64" required autocomplete="username">
        </div>
        <div class="field">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <div class="actions">
            <button type="submit" class="btn btn-primary">ログイン</button>
        </div>
    </form>
</main>
</body>
</html>
