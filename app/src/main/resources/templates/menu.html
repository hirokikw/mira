<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>メインメニュー | MIRA</title>
    <link rel="stylesheet" th:href="@{/css/mira.css}">
</head>
<body>
<main class="card card-medium">
    <h1 class="page-title">メインメニュー</h1>
    <p class="user-greeting">ログイン中: <span th:text="${loginId}">admin</span></p>

    <nav class="menu" aria-label="メインメニュー">
        <a class="btn btn-secondary menu-item" th:href="@{/users/registration}">ユーザー登録</a>
        <a class="btn btn-secondary menu-item" th:href="@{/users}">ユーザー一覧</a>
    </nav>

    <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="btn btn-link">ログアウト</button>
    </form>
</main>
</body>
</html>
